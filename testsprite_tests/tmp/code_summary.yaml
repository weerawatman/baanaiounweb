version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router, Turbopack)
  - React 19
  - Tailwind CSS 4 + shadcn/ui
  - Supabase (PostgreSQL + Storage)
  - React Hook Form + Zod
  - Recharts
  - Embla Carousel
  - Framer Motion
  - Resend (email) + LINE Messaging API (notifications)
routes:
  - path: /
    file: src/app/(public)/page.tsx
    auth_required: false
    description: Home page with hero (2 CTAs to /request), smart property search, service cards, why-choose-us, testimonials, FAQ. Always displays Thai+English together (no language toggle).
  - path: /request
    file: src/app/(public)/request/page.tsx
    auth_required: false
    description: NEW tabbed service-request page. 3 tabs (?tab=list-property | matchmaking | co-agent), each with the same 7-field form (adapted labels).
  - path: /properties
    file: src/app/(public)/properties/page.tsx
    auth_required: false
    description: Full property listing grid with purpose/district/price filters
  - path: /property/[slug]
    file: src/app/(public)/property/[slug]/page.tsx
    auth_required: false
    description: Single property detail page with gallery, mortgage calculator, contact CTAs
  - path: /find-property
    file: src/app/(public)/find-property/page.tsx
    auth_required: false
    description: Lead-generation landing page for buyers/renters (legacy click-to-reveal form)
  - path: /list-property
    file: src/app/(public)/list-property/page.tsx
    auth_required: false
    description: Lead-generation landing page for property owners (legacy click-to-reveal form, image upload, FAQ)
  - path: /co-agent
    file: src/app/(public)/co-agent/page.tsx
    auth_required: false
    description: Partner/co-agent recruitment landing page (legacy click-to-reveal form)
  - path: /services
    file: src/app/(public)/services/page.tsx
    auth_required: false
    description: Services hub linking to Find Property, List Property, Co-Agent, Agent Course
  - path: /agent-course
    file: src/app/(public)/agent-course/page.tsx
    auth_required: false
    description: Marketing page for agent training course with application form
  - path: /blog
    file: src/app/(public)/blog/page.tsx
    auth_required: false
    description: Blog listing with category filter and search (may have no published posts)
  - path: /blog/[slug]
    file: src/app/(public)/blog/[slug]/page.tsx
    auth_required: false
    description: Single blog post page with related properties
  - path: /contact
    file: src/app/(public)/contact/page.tsx
    auth_required: false
    description: Contact page with inline form, click-to-call/LINE/WhatsApp links, embedded map
  - path: /about
    file: src/app/(public)/about/page.tsx
    auth_required: false
    description: Company story, milestones/timeline, and values (static content)
  - path: /privacy-policy
    file: src/app/(public)/privacy-policy/page.tsx
    auth_required: false
    description: Bilingual PDPA privacy policy (static content), linked from footer
features:
  - name: Service Request Tabbed Form (NEW - primary test target)
    description: One page with 3 selectable service tabs; each tab shows a form with 7 fields (labels adapt per tab). Submissions insert into a per-tab Supabase table and fire LINE/email notifications.
    files:
      - src/app/(public)/request/RequestPage.tsx
      - src/app/(public)/request/RequestForm.tsx
      - src/app/api/service-request/route.ts
    entry_route: /request
    user_interactions:
      - Click one of 3 tab cards (ฝากขาย/ปล่อยเช่า | จัดหาทรัพย์ตามต้องการ | ร่วมเป็น Co-Agent) — URL ?tab= updates
      - Fill name (required), phone/WhatsApp/LINE (required), email (required, format-validated)
      - Select property type from dropdown (บ้านเดี่ยว, บ้านแฝด, ทาวน์โฮม, คอนโด, ที่ดิน) (required)
      - Fill location (required), budget (optional)
      - Optionally upload up to 5 images (jpg/png/webp, 5MB each)
      - Submit; see bilingual success card; "Submit Another Request" resets
      - Submitting with missing/invalid email shows bilingual validation error
    api_calls:
      - method: POST
        endpoint: /api/service-request
      - method: POST
        endpoint: /api/upload-images
    auth_required: false
  - name: Homepage Hero & Service CTAs (redesigned)
    description: Hero has 2 CTA buttons linking to /request tabs; 4 service cards below, first 3 link to /request tabs, 4th to /agent-course. CTA labels are stacked Thai-over-English.
    files:
      - src/components/home/HeroSection.tsx
      - src/components/home/ServiceShortcuts.tsx
    entry_route: /
    user_interactions:
      - Click hero "ฝากขาย/ปล่อยเช่า | List Your Property" → /request?tab=list-property
      - Click hero "บริการจัดหาทรัพย์ตามต้องการ | Property Matchmaking Service" → /request?tab=matchmaking
      - Click service card CTAs → /request tabs or /agent-course
    api_calls: []
    auth_required: false
  - name: Smart Property Search & Filter
    description: Client-side filtering of preloaded property listings by purpose, district, and price on home and listing pages
    files:
      - src/components/home/SmartSearchWrapper.tsx
      - src/app/(public)/properties/PropertiesPage.tsx
    entry_route: /
    user_interactions:
      - Click purpose tab (All / Buy / Rent / Land)
      - Select district and max price from dropdowns
      - Click a property card (aria-label = property title) to open /property/[slug]
    api_calls: []
    auth_required: false
  - name: Property Detail View
    description: Single property page with image gallery lightbox and live mortgage/loan calculator
    files:
      - src/app/(public)/property/[slug]/page.tsx
    entry_route: /property/[slug]
    user_interactions:
      - Open image gallery lightbox and navigate images
      - Use mortgage calculator inputs; chart updates live
      - Click LINE or phone CTA
    api_calls: []
    auth_required: false
  - name: Legacy Lead Forms (click-to-reveal)
    description: On /find-property, /list-property, /co-agent, /agent-course the form only appears AFTER clicking the "Ready to Get Started?" primary CTA button at the page bottom. Do not report "form not found" without clicking that CTA first.
    files:
      - src/components/shared/CTAWithForm.tsx
      - src/components/shared/PropertyForm.tsx
    entry_route: /list-property
    user_interactions:
      - Scroll to bottom CTA section, click primary button to reveal the form
      - Fill and submit (POST /api/submit-form, rate limit 3/min/IP)
    api_calls:
      - method: POST
        endpoint: /api/submit-form
    auth_required: false
  - name: Contact Form
    description: General contact form with subject selection, plus direct contact links and embedded map
    files:
      - src/app/(public)/contact/ContactPage.tsx
    entry_route: /contact
    user_interactions:
      - Fill name/phone/email, select subject, fill message, submit
      - Click call / LINE / WhatsApp / email cards
    api_calls:
      - method: POST
        endpoint: /api/submit-form
    auth_required: false
  - name: Bilingual Display (no toggle)
    description: Site permanently displays Thai and English together (Thai primary, English secondary). There is NO language switcher.
    files:
      - src/components/layout/Header.tsx
    entry_route: /
    user_interactions:
      - Verify both languages visible simultaneously on any page
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Testing against PRODUCTION deployment via local proxy
    location: localhost:3100 proxies to https://baanaiounweb.vercel.app
    impact: Form submissions create REAL rows in the production database and fire REAL LINE/email notifications to the site owner. Submit at most ONE test per form, and always prefix test names with "TestSprite" so the owner can identify and delete them.
  - issue: Legacy routes redirect
    location: next.config.ts
    impact: /buy /rent /land → /find-property, /owners → /list-property, /academy → /agent-course (301). These are redirects only; do not treat as pages.
  - issue: Rate limits per IP
    location: /api/service-request and /api/submit-form (3/min), /api/upload-images (20/min)
    impact: Do not submit forms rapidly; space out submissions.
  - issue: Blog may have no published posts
    location: /blog
    impact: An empty blog listing with "ยังไม่มีบทความ" is expected behavior, not a bug.
